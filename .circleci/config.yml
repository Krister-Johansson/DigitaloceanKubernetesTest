version: 2.1
orbs:
  node: circleci/node@5
executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5
  docker-executor:
    docker:
      - image: docker:stable
    working_directory: ~/project
jobs:
  lint-and-test:
    executor: node-executor
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint code
          command: npm run lint
      - run:
          name: Run tests
          command: npm test
  build-and-publish:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t registry.digitalocean.com/YOUR_REGISTRY/YOUR_IMAGE_NAME:${CIRCLE_SHA1} .
      - run:
          name: Docker login
          command: echo $DOCKERHUB_PASSWORD | docker login registry.digitalocean.com -u $DOCKERHUB_USERNAME --password-stdin
      - run:
          name: Push Docker image
          command: docker push registry.digitalocean.com/YOUR_REGISTRY/YOUR_IMAGE_NAME:${CIRCLE_SHA1}
  deploy-preview:
    executor: docker-executor
    steps:
      - run:
          name: Deploy to Kubernetes for preview
          command: kubectl set image deployment/your-deployment your-container=registry.digitalocean.com/YOUR_REGISTRY/YOUR_IMAGE_NAME:${CIRCLE_SHA1}
  deploy-qa:
    executor: docker-executor
    steps:
      - run:
          name: Deploy to QA
          command: kubectl set image deployment/qa-deployment qa-container=registry.digitalocean.com/YOUR_REGISTRY/YOUR_IMAGE_NAME:${CIRCLE_SHA1}
  deploy-prod:
    executor: docker-executor
    steps:
      - run:
          name: Deploy to Production
          command: kubectl set image deployment/prod-deployment prod-container=registry.digitalocean.com/YOUR_REGISTRY/YOUR_IMAGE_NAME:${CIRCLE_SHA1}
workflows:
  version: 2
  pr_workflow:
    jobs:
      - lint-and-test
      - build-and-publish:
          requires:
            - lint-and-test
      - deploy-preview:
          requires:
            - build-and-publish
  merge_workflow:
    jobs:
      - deploy-qa
      - deploy-prod:
          requires:
            - deploy-qa